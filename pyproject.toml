[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resource-superstaq"
dynamic = ["version", "dependencies"]
description = "Infleqtion's resource estimation project for fault tolerant quantum computing"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["resource_estimation*"]

[tool.setuptools.dynamic]
version = { attr = "resource_estimation._version.__version__" }
dependencies = { file = ["requirements.txt"] }

# Check script configuration:

[tool.pytest.ini_options]
addopts = "--disable-socket"
filterwarnings = [
  "ignore::UserWarning:qtrl.*",
  "ignore::PendingDeprecationWarning:qtrl.utils.config",
  "ignore::PendingDeprecationWarning:ruamel.yaml.main",
]

[tool.ruff]
line-length = 100
target-version = "py39"
show-fixes = true

# Specific linting rules to enable in `ruff`
lint.select = [
  "FA",    # flake8-future-annotations
  "F401",  # unused imports
  "I",
  "ANN",
  "B",
  "B905",
  "C409",    # See https://github.com/astral-sh/ruff/issues/12912
  "C420",
  "C",
  "D",
  "E",
  "FAST",
  "PLC",
  "PLW",
  "PT019",
  "PT022",
  "PYI041",
  "RUF001",
  "RUF002",
  "SIM102",
  "SIM105",
  # "PLR",  # Has a bunch of the too many branches/too many statements/too many arguments type stuff
    # Would require pretty significant refactoring to fix all of this
  # The following are excluded to not conflict with `ruff format`:
  "COM819",
  "D206",
  "D300",
  "E111",
  "E114",
  "E117",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "W191",
]
lint.ignore = [
  "ARG002",
  "ARG005",
  "B008",
  # "B019",
  # "B023",
  # "B034",
  "B904",
  # "B905",
  # "C409",    # See https://github.com/astral-sh/ruff/issues/12912
  "C416",
  # "C420",
  "C901",
  "D100",
    # Want to un-comment these (D100-107 once all classes/functions are documented, but that is not 
    # my current PR
  "D101", # Public class docs
  "D102", # Public method docs
  "D103", # Public function docs
  "D104", # Public package docs
  "D105", # Other __ method docs
  "D107", # __init__ docs
  "D205", # One blank line? In docstring for summary vs detailed description I guess
  "E501", # Line too long
  # "D301",
  # "E731",
  # "FAST002",
  "PERF401",
  # "PLC0105",
  # "PLC0206",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR2004",
  "PLW1641", # Object does not implement hashing
  # "PLW2901",
  "PT012",
  # "PT019",
  # "PT022",
  # "PYI041",
  "RET504",
  # "RUF001",
  # "RUF002",
  # "SIM102",
  # "SIM105",
  "SIM108",
 # "SIM118",
  "TC003",
  "TD002",
  "TD003",
  "TRY003",
  # The following are excluded to not conflict with `ruff format`:
  "COM812",
  # "COM819",
  # "D206",
  # "D300",
  # "E111",
  # "E114",
  # "E117",
  # "Q000",
  # "Q001",
  # "Q002",
  # "Q003",
  # "W191",
]

# Allow autofix for all enabled rules (when `--fix` is passed)
lint.fixable = ["ALL"]
lint.unfixable = []

# Allow unused variables when underscore-prefixed
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Enable `from __future__ import annotations` simplification for rules
lint.future-annotations = true

[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["collections.abc"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["D101", "D102", "D103", "E501", "ERA001", "T201"]
"*test.py" = ["D101", "D102", "D103", "ANN201", "ANN001"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["property", "classmethod", "staticmethod"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
case-sensitive = false


[tool.mypy]
pretty = true
ignore_missing_imports = true
warn_redundant_casts = true
show_error_codes = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
install_types = true
non_interactive = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "@overload"]

[tool.coverage.run]
include = ["./*"]
concurrency = ["thread"]
parallel = true
patch = ["subprocess"]

[tool.licensepy]
license_header_template = """Copyright {year} {licensee}

Licensed under the Apache License, Version 2.0 (the "License");
you may not use this file except in compliance with the License.
You may obtain a copy of the License at

    http://www.apache.org/licenses/LICENSE-2.0

Unless required by applicable law or agreed to in writing, software
distributed under the License is distributed on an "AS IS" BASIS,
WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
See the License for the specific language governing permissions and
limitations under the License.
"""
licensee = "Infleqtion"
