[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "surface-code-deq"
version = "0.1.0"
description = "DEQ gadget definitions for rotated surface-code experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "deq",
    "deq-runtime",
    "protobuf>=7.35.1",
    "stim>=1.15",
    "numpy>=1.24",
    "pymatching>=2.4",
]

[project.scripts]
surface-code-deq-generate = "surface_code_deq.library:main"
surface-code-deq-ler = "surface_code_deq.verification.ler:main"
surface-code-deq-verify = "surface_code_deq.verification.choi:main"
surface-code-deq-distance = "surface_code_deq.verification.distance:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
notebooks = ["ipywidgets>=8", "ipykernel>=6"]
sat = ["python-sat>=1.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/surface_code_deq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: launches DEQ's worker-process integration test",
]
